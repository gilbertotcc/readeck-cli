[project]
name = "readeck-cli"
version = "0.1.0"
authors = [
    { name = "Gilberto Taccari", email = "gilberto.taccari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
]

[project.scripts]
readeck-cli = "readeck_cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-regressions>=2.8.1",
    "ruff>=0.17.3",
]
