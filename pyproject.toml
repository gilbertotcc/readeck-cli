[project]
name = "readeck-cli"
version = "0.1.0"
authors = [
    { name = "Gilberto Taccari", email = "gilberto.taccari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
]

[project.scripts]
readeck-cli = "readeck_cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
