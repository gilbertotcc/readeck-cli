[project]
name = "readeck-cli"
version = "0.1.0"
authors = [
    { name = "Gilberto Taccari", email = "gilberto.taccari@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
    "urllib3>=2.7.0,<3.0.0",
]

[project.scripts]
readeck-cli = "readeck_cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
