name: Check Python code

on:
  pull_request:
    paths:
    - 'src/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'ruff.toml'
    - 'mypy.ini'
    - 'pytest.ini'
    - '.github/workflows/check-python.yml'
  push:
    branches:
    - 'main'
    paths:
    - 'src/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'ruff.toml'
    - 'mypy.ini'
    - 'pytest.ini'
    - '.github/workflows/check-python.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install project dependencies
      run: uv sync --dev
    - name: Run ruff check
      run: uv run ruff check
    - name: Run ruff format check
      run: uv run ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install project dependencies
      run: uv sync --dev
    - name: Run mypy
      run: uv run mypy src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install project dependencies
      run: uv sync --dev
    - name: Run pytest
      run: uv run pytest
