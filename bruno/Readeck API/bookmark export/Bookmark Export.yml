info:
  name: Bookmark Export
  type: http
  seq: 2
  tags:
    - bookmark export

http:
  method: GET
  url: "{{baseUrl}}/bookmarks/:id/article.:format"
  params:
    - name: id
      value: ""
      type: path
      description: Bookmark ID
    - name: format
      value: epub
      type: path
      description: Export format
    - name: format
      value: md
      type: path
      description: Export format
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/bookmarks/:id/article.:format"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: format
          value: epub
          type: path
          description: Export format
        - name: format
          value: md
          type: path
          description: Export format
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/epub+zip
      body:
        type: text
        data: ""
  - name: 200 Response
    request:
      url: "{{baseUrl}}/bookmarks/:id/article.:format"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: format
          value: epub
          type: path
          description: Export format
        - name: format
          value: md
          type: path
          description: Export format
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/markdown
      body:
        type: text
        data: ""
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
      url: "{{baseUrl}}/bookmarks/:id/article.:format"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: format
          value: epub
          type: path
          description: Export format
        - name: format
          value: md
          type: path
          description: Export format
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/:id/article.:format"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: format
          value: epub
          type: path
          description: Export format
        - name: format
          value: md
          type: path
          description: Export format
          disabled: true
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }

docs: This route exports a bookmark to another format.
