info:
  name: Import Wallabag Articles
  type: http
  seq: 9
  tags:
    - bookmark import

http:
  method: POST
  url: "{{baseUrl}}/bookmarks/import/wallabag"
  body:
    type: json
    data: |-
      {
        "url": "",
        "username": "",
        "password": "",
        "client_id": "",
        "client_secret": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

