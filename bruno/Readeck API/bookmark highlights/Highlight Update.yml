      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/:id/annotations/:annotation_id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: annotation_id
          value: ""
          type: path
          description: Highlight ID
      body:
        type: json
        data: |-
          {
            "color": ""
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 422 Response
    description: |
      This HTTP response is sent when the input data is not valid. It contains an object
