info:
  name: Highlight Update
  type: http
  seq: 4
  tags:
    - bookmark highlights

http:
  method: PATCH
  url: "{{baseUrl}}/bookmarks/:id/annotations/:annotation_id"
  params:
    - name: id
      value: ""
      type: path
      description: Bookmark ID
    - name: annotation_id
      value: ""
      type: path
      description: Highlight ID
  body:
    type: json
    data: |-
      {
        "color": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Update result
    request:
      url: "{{baseUrl}}/bookmarks/:id/annotations/:annotation_id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: annotation_id
          value: ""
          type: path
          description: Highlight ID
      body:
        type: json
        data: |-
          {
            "color": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "updated": "",
            "annotations": [
              {
                "id": "",
                "start_selector": "",
                "start_offset": 0,
                "end_selector": "",
                "end_offset": 0,
                "created": "",
                "text": ""
              }
            ]
          }
