    request:
      url: "{{baseUrl}}/bookmarks/:id/annotations/:annotation_id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
        - name: annotation_id
          value: ""
          type: path
          description: Highlight ID
      body:
        type: json
        data: |-
          {
            "color": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
