info:
  name: Bookmark Highlights
  type: http
  seq: 2
  tags:
    - bookmark highlights

http:
  method: GET
  url: "{{baseUrl}}/bookmarks/:id/annotations"
  params:
    - name: id
      value: ""
      type: path
      description: Bookmark ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Highlight list
    request:
      url: "{{baseUrl}}/bookmarks/:id/annotations"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "start_selector": "",
              "start_offset": 0,
              "end_selector": "",
              "end_offset": 0,
              "created": "",
              "text": ""
            }
          ]
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
      url: "{{baseUrl}}/bookmarks/:id/annotations"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/:id/annotations"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }

docs: |
  This route returns a given bookmark's highlights.
