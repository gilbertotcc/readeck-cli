info:
  name: Highlight Create
  type: http
  seq: 3
  tags:
    - bookmark highlights

http:
  method: POST
  url: "{{baseUrl}}/bookmarks/:id/annotations"
  params:
    - name: id
      value: ""
      type: path
      description: Bookmark ID
  body:
    type: json
    data: |-
      {
        "start_selector": "",
        "start_offset": 0,
        "end_selector": "",
        "end_offset": 0,
        "color": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

