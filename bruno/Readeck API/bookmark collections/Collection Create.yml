info:
  name: Collection Create
  type: http
  seq: 2
  tags:
    - bookmark collections

http:
  method: POST
  url: "{{baseUrl}}/bookmarks/collections"
  body:
    type: json
    data: |-
      {
        "name": "",
        "is_pinned": false,
        "is_deleted": false,
        "search": "",
        "title": "",
        "author": "",
        "site": "",
        "type": [
          "article"
        ],
        "labels": "",
        "read_status": [
          "unread"
        ],
        "is_marked": false,
        "is_archived": false,
        "range_start": "",
        "range_end": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

