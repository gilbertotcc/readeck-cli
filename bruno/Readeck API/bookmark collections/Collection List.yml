info:
  name: Collection List
  type: http
  seq: 1
  tags:
    - bookmark collections

http:
  method: GET
  url: "{{baseUrl}}/bookmarks/collections"
  params:
    - name: limit
      value: ""
      type: query
      description: Number of items per page
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Pagination offset
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Collection list
    request:
      url: "{{baseUrl}}/bookmarks/collections"
      method: GET
      params:
        - name: limit
          value: ""
          type: query
          description: Number of items per page
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Pagination offset
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "[]"
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
      url: "{{baseUrl}}/bookmarks/collections"
      method: GET
      params:
        - name: limit
          value: ""
          type: query
          description: Number of items per page
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Pagination offset
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/collections"
      method: GET
      params:
        - name: limit
          value: ""
          type: query
          description: Number of items per page
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Pagination offset
          disabled: true
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }

docs: |
  This route returns all the current user's collections.
