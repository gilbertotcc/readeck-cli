info:
  name: Collection Update
  type: http
  seq: 4
  tags:
    - bookmark collections

http:
  method: PATCH
  url: "{{baseUrl}}/bookmarks/collections/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Collection ID
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Updated fields
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "updated": "",
            "name": "",
            "is_pinned": false,
            "is_deleted": false,
            "search": "",
            "title": "",
            "author": "",
            "site": "",
            "type": [
              "article"
            ],
            "labels": "",
            "read_status": [
              "unread"
            ],
            "is_marked": false,
            "is_archived": false,
            "range_start": "",
            "range_end": ""
          }
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
      body:
        type: json
        data: "{}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
      body:
        type: json
        data: "{}"
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 422 Response
    description: |
      This HTTP response is sent when the input data is not valid. It contains an object
      with all the detected errors.
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
      body:
        type: json
        data: "{}"
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "is_valid": false,
            "errors": "",
            "fields": {}
          }

docs: |
  This route updates a given collection. It returns a mapping of updated fields.
