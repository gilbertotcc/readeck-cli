info:
  name: Collection Details
  type: http
  seq: 3
  tags:
    - bookmark collections

http:
  method: GET
  url: "{{baseUrl}}/bookmarks/collections/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Collection ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Collection information
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/collections/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Collection ID
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }

docs: |
  This route returns a given collection information.
