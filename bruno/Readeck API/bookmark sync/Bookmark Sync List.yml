info:
  name: Bookmark Sync List
  type: http
  seq: 1
  tags:
    - bookmark sync

http:
  method: GET
  url: "{{baseUrl}}/bookmarks/sync"
  params:
    - name: since
      value: ""
      type: query
      description: A datetime to retrieve updated and deleted IDs including and after this value.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Item list
    request:
      url: "{{baseUrl}}/bookmarks/sync"
      method: GET
      params:
        - name: since
          value: ""
          type: query
          description: A datetime to retrieve updated and deleted IDs including and after this value.
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "time": "",
              "type": "update"
            }
          ]
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
      url: "{{baseUrl}}/bookmarks/sync"
      method: GET
      params:
        - name: since
          value: ""
          type: query
          description: A datetime to retrieve updated and deleted IDs including and after this value.
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 403 Response
    description: |
      Forbidden. The user doesn't have permission to perform the request but has other permissions.
    request:
      url: "{{baseUrl}}/bookmarks/sync"
      method: GET
      params:
        - name: since
          value: ""
          type: query
          description: A datetime to retrieve updated and deleted IDs including and after this value.
          disabled: true
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 422 Response
    description: |
      This HTTP response is sent when the input data is not valid. It contains an object
      with all the detected errors.
    request:
      url: "{{baseUrl}}/bookmarks/sync"
      method: GET
      params:
        - name: since
          value: ""
          type: query
          description: A datetime to retrieve updated and deleted IDs including and after this value.
          disabled: true
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "is_valid": false,
            "errors": "",
            "fields": {}
          }

docs: |
  This route returns a non-paginated list of all bookmarks ordered by last update dates.

  You can retrieve only bookmarks updated and deleted since a given date by using the
  `since` parameter. Please note that without the parameter, it only returns updated
  bookmarks.
