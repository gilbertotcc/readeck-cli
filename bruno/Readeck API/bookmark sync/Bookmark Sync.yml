info:
  name: Bookmark Sync
  type: http
  seq: 2
  tags:
    - bookmark sync

http:
  method: POST
  url: "{{baseUrl}}/bookmarks/sync"
  body:
    type: json
    data: |-
      {
        "id": [],
        "sort": [
          "created"
        ],
        "with_json": false,
        "with_html": false,
        "with_markdown": false,
        "with_resources": false,
        "resource_prefix": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

