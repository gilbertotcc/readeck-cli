info:
  name: Bookmark Update
  type: http
  seq: 4
  tags:
    - bookmarks

http:
  method: PATCH
  url: "{{baseUrl}}/bookmarks/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Bookmark ID
  body:
    type: json
    data: |-
      {
        "title": "",
        "description": "",
        "site_name": "",
        "authors": [],
        "published": "",
        "lang": "",
        "text_direction": "ltr",
        "note": "",
        "is_marked": false,
        "is_archived": false,
        "is_deleted": false,
        "read_progress": 0,
        "read_anchor": "",
        "labels": [],
        "add_labels": "",
        "remove_labels": ""
      }
  auth: inherit

settings:
