info:
  name: Bookmark Create
  type: http
  seq: 2
  tags:
    - bookmarks

http:
  method: POST
  url: "{{baseUrl}}/bookmarks"
  body:
    type: json
    data: |-
      {
        "url": "",
        "title": "",
        "labels": [],
        "created": "",
        "html": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

