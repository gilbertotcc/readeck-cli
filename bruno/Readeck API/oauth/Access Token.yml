info:
  name: Access Token
  type: http
  seq: 2
  tags:
    - oauth

http:
  method: POST
  url: "{{baseUrl}}/oauth/token"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Access Token
    request:
      url: "{{baseUrl}}/oauth/token"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "access_token": "",
            "token_type": "Bearer",
            "scope": ""
          }
  - name: 400 Response
    request:
      url: "{{baseUrl}}/oauth/token"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "access_denied",
            "error_description": ""
          }

docs: |
  A client must call this route once it received the necessary information from the
  redirect URI generated by the authorization route.

  Please refer to:

  - [OAuth Authorization Code Flow](#overview--oauth-authorization-code-flow) for details about the authorization code flow
  - [OAuth Device Code Flow](#overview--oauth-device-code-flow) for details about the device code flow
