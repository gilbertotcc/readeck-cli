info:
  name: Share by email
  type: http
  seq: 2
  tags:
    - bookmark sharing

http:
  method: POST
  url: "{{baseUrl}}/bookmarks/:id/share/email"
  params:
    - name: id
      value: ""
      type: path
      description: Bookmark ID
  body:
    type: json
    data: |-
      {
        "email": "alice@localhost",
        "format": "html",
        "with_notes": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Message sent
    request:
      url: "{{baseUrl}}/bookmarks/:id/share/email"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Bookmark ID
      body:
        type: json
        data: |-
          {
            "email": "alice@localhost",
            "format": "html",
            "with_notes": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 401 Response
    description: |
      Unauthorized. The request token found in the Authorization header is not valid.
    request:
